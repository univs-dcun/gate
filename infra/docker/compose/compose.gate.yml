# ============================================================
# 제품 — gate (UG-246)
# e-KYC 제품 백엔드. face/palm 역량 모듈과 notify를 소비한다.
# ============================================================

services:

  gate-service:
    networks:
      - platform-net
    image: ${DOCKHUB_GATE_URL}/gate-service:${GATE_SERVICE_VERSION}
    volumes:
      - ./logs:/logs
      - ./docker-backup/uploads:/var/uploads
    environment:
      SPRING_PROFILES_ACTIVE: ${CORE_SPRING_PROFILES_ACTIVE}
      # UG-296: 오라클은 계정과 스키마가 1:1 이라 서비스마다 계정을 따로 판다. 아래 세 줄이
      # 실제로 계정을 정하는 자리다 — 서비스는 spring.config.import 로 config-server 를 읽는
      # config-data 경로라, 컨테이너 환경변수가 config-server 값을 이긴다. 그래서 gate-config
      # 의 {서비스}-oracle.yml 만 고쳐서는 아무것도 바뀌지 않는다.
      #
      # {서비스}_DB_* 를 .env 에 넣으면 그 값이 쓰이고, 없으면 기존 CORE_DB_* 로 떨어진다.
      # PostgreSQL 환경(dev/stage/prod)은 CORE_DB_* 만 쓰므로 동작이 그대로다.
      # 절차: gate 레포 docs/onpremise-oracle-setup.md
      SPRING_DATASOURCE_URL: ${GATE_DB_URL:-${CORE_DB_URL}/gate}
      SPRING_DATASOURCE_USERNAME: ${GATE_DB_USERNAME:-${CORE_DB_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${GATE_DB_PASSWORD:-${CORE_DB_PASSWORD}}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      GATEWAY_URL: ${GATEWAY_URL}
      GATE_DEMO_URL: ${GATE_DEMO_URL}
      GATE_DASHBOARD_QR-URL: ${GATE_DEMO_URL}
      FILE_API-ENDPOINT_GET: ${FILE_API_ENDPOINT_GET}
      FILE_ENABLE_UPLOAD: ${FILE_ENABLE_UPLOAD}
      FILE_ROOT_PATH: ${FILE_ROOT_PATH}
      FILE_SECRET_KEY: ${FILE_SECRET_KEY}
      FILE_ALGORITHM_WAY: ${FILE_ALGORITHM_WAY}
      FILE_ALGORITHM_MOD: ${FILE_ALGORITHM_MOD}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/gate/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  platform-net:
    external: true
    name: ${DOCKER_NETWORK:-platform-net}
