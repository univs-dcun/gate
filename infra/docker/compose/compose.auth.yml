# ============================================================
# 범용 모듈 — auth (UG-246)
# 계정/토큰 관리. 도메인 무관 — 어떤 제품 조합에도 그대로 사용.
# 경계 계약: docs/scaffold-contract.md §1
# ============================================================

services:

  auth-service:
    networks:
      - platform-net
    image: ${DOCKHUB_GATE_URL}/auth-service:${AUTH_SERVICE_VERSION}
    volumes:
      - ./logs:/logs
    environment:
      SPRING_PROFILES_ACTIVE: ${CORE_SPRING_PROFILES_ACTIVE}
      # UG-296: 오라클은 계정과 스키마가 1:1 이라 서비스마다 계정을 따로 판다. 아래 세 줄이
      # 실제로 계정을 정하는 자리다 — 서비스는 spring.config.import 로 config-server 를 읽는
      # config-data 경로라, 컨테이너 환경변수가 config-server 값을 이긴다. 그래서 gate-config
      # 의 {서비스}-oracle.yml 만 고쳐서는 아무것도 바뀌지 않는다.
      #
      # {서비스}_DB_* 를 .env 에 넣으면 그 값이 쓰이고, 없으면 기존 CORE_DB_* 로 떨어진다.
      # PostgreSQL 환경(dev/stage/prod)은 CORE_DB_* 만 쓰므로 동작이 그대로다.
      # 절차: gate 레포 docs/onpremise-oracle-setup.md
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL:-${CORE_DB_URL}/auth}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USERNAME:-${CORE_DB_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-${CORE_DB_PASSWORD}}
      GOOGLE_OAUTH2_EMAIL: ${GOOGLE_OAUTH2_EMAIL}
      GOOGLE_OAUTH2_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
      GOOGLE_OAUTH2_CLIENT_SECRET: ${GOOGLE_OAUTH2_CLIENT_SECRET}
      GOOGLE_OAUTH2_REFRESH_TOKEN: ${GOOGLE_OAUTH2_REFRESH_TOKEN}
      GOOGLE_OAUTH2_ACCESS_TOKEN_URL: ${GOOGLE_OAUTH2_ACCESS_TOKEN_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_CREATE_USER_TOKEN_EXPIRY: ${JWT_CREATE_USER_TOKEN_EXPIRY}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/auth/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  platform-net:
    external: true
    name: ${DOCKER_NETWORK:-platform-net}
