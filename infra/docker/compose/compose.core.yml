# ============================================================
# 스캐폴드 core — config, discovery, gateway (UG-246)
# 모든 배포 조합에 필수. 조합 선택은 .env의 COMPOSE_FILE 참고.
# ============================================================

services:

  config-server:
    networks:
      - platform-net
    ports:
      - ${CONFIG_HOST_PORT:-8888}:8888
    image: ${DOCKHUB_GATE_URL}/config-server:${CONFIG_SERVER_VERSION}
    volumes:
      - ./spring-config:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: ${CONFIG_SERVER_PROFILE}
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_PASSWORD: ${GIT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  discovery-server:
    networks:
      - platform-net
    ports:
      - ${DISCOVERY_HOST_PORT:-8761}:8761
    image: ${DOCKHUB_GATE_URL}/discovery-server:${DISCOVERY_SERVER_VERSION}
    volumes:
      - ./logs:/logs
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  gateway-server:
    networks:
      - platform-net
    ports:
      - ${GATEWAY_HOST_PORT:-8080}:8080
    image: ${DOCKHUB_GATE_URL}/gateway-server:${GATEWAY_SERVER_VERSION}
    volumes:
      - ./logs:/logs
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      # UG-252: auth 미인증 엔드포인트 rate limit(RequestRateLimiter)이 쓰는 Redis.
      # 민감정보는 yml이 아니라 여기서 주입한다 (스캐폴드 계약 §4.3).
      # 누락되면 rate limit이 조용히 꺼진다 — RedisRateLimiter는 오류 시 요청을
      # 통과시키므로(fail-open) 기동 로그의 경고로만 드러난다.
      # 기본값을 둔다 — .env에 REDIS_HOST가 없으면 compose가 '빈 문자열' 환경변수를
      # 주입하고, 빈 문자열도 존재하는 값이라 yml의 ${REDIS_HOST:redis} 안전망을 덮어쓴다.
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  platform-net:
    external: true
    name: ${DOCKER_NETWORK:-platform-net}
