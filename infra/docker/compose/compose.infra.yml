# ============================================================
# 공유 인프라 — postgresql, redis (UG-246)
# 외부 DB/Redis를 쓰는 배포(예: 일부 온프레미스)에서는 이 파일을 제외한다.
# ============================================================

services:

  platform-postgresql:
    networks:
      - platform-net
    ports:
      - ${POSTGRES_HOST_PORT:-5432}:5432
    image: postgres:17.2
    volumes:
      - ../docker-backup/postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    restart: unless-stopped

  redis:
    networks:
      - platform-net
    ports:
      - ${REDIS_HOST_PORT:-6379}:6379
    image: redis:7.4.2
    volumes:
      - ../docker-backup/redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped

networks:
  platform-net:
    external: true
    name: ${DOCKER_NETWORK:-platform-net}
