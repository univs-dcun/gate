spring:
  config:
    activate:
      on-profile: postgresql
  # UG-307: 접속 정보는 앱 소스에 두지 않는다. 컨테이너 환경변수(SPRING_DATASOURCE_URL/USERNAME/PASSWORD,
  # compose 가 서비스마다 준다)나 config-server(gate-config)가 채우며, 둘 다 없으면 플레이스홀더를 풀 수 없어
  # 기동이 즉시 실패한다 — 예전처럼 사내 개발 DB 로 조용히 붙는 대신 설정 누락을 드러내는 것이 의도다.
  # 로컬 실행은 세 환경변수를 주거나, src/main/resources 밖의 파일을 --spring.config.additional-location 으로 준다
  # (resources 안에 두면 가드 테스트가 막고 bootJar 에 실린다). DatasourceCredentialGuardTest 가 이 규칙을 지킨다.
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # baseline 설정을 제거했다 (UG-305 후속, 2026-09-22). 원래 여기에
    # baseline-on-migrate: true / baseline-version: 1 이 있었다.
    #
    # 사내 dev PostgreSQL 스키마 입양(UG-229)용이었고 그 입양은 끝났다 — 이력
    # 테이블이 있는 환경에서는 아무 일도 하지 않는다. 영향을 받는 것은 신규
    # 설치뿐이었고 거기서는 해로웠다: 스키마에 객체가 하나라도 있으면
    # V1~V1 을 건너뛴 채 기동에 성공한 뒤 런타임에 터진다. 온프레미스 3.0.3
    # 검증에서 gate·match 가 실제로 그렇게 실패했다.
    #
    # 이제는 비어 있지 않은 스키마에서 Flyway 가 "Found non-empty schema without
    # schema history table" 로 그 자리에서 멈춘다. gate-config 의
    # palm-*-postgresql.yml 에서도 함께 제거했다 — 한쪽만 지우면 다른 쪽 값이
    # 그대로 적용되어 효과가 없다.
    locations: classpath:db/migration/postgresql
