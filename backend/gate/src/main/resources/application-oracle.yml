spring:
  config:
    activate:
      on-profile: oracle
  # UG-296: 서비스마다 오라클 계정이 달라야 한다. 오라클은 계정과 스키마가 1:1 이라
  # 한 계정을 나눠 쓰면 flyway_schema_history 까지 공유하게 되고, 두 번째로 뜨는
  # 서비스가 자기 V1 의 체크섬 불일치로 기동에 실패한다 (PostgreSQL 은 서비스별
  # 데이터베이스를 쓰고 있어 이 문제가 없다). 계정 생성 절차는
  # docs/onpremise-oracle-setup.md 참고.
  # UG-307: 접속 정보는 앱 소스에 두지 않는다. 컨테이너 환경변수(SPRING_DATASOURCE_URL/USERNAME/PASSWORD,
  # compose 가 서비스마다 준다)나 config-server(gate-config)가 채우며, 둘 다 없으면 플레이스홀더를 풀 수 없어
  # 기동이 즉시 실패한다 — 예전처럼 사내 개발 DB 로 조용히 붙는 대신 설정 누락을 드러내는 것이 의도다.
  # 로컬 실행은 세 환경변수를 주거나, src/main/resources 밖의 파일을 --spring.config.additional-location 으로 준다
  # (resources 안에 두면 가드 테스트가 막고 bootJar 에 실린다). DatasourceCredentialGuardTest 가 이 규칙을 지킨다.
  datasource:
    driverClassName: oracle.jdbc.OracleDriver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration/oracle
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.OracleDialect
