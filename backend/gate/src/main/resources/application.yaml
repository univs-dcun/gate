# chore: 자동배포 파이프라인 테스트

spring:
  application:
    name: gate-service
  config:
    import: optional:configserver:http://config-server:8888

  jpa:
    # UG-335: 모든 환경에 적용한다. 예전에는 아래 local 프로파일 문서 안에만 있어서
    # dev·stage·prod·onpremise 가 전부 Boot 기본값(true)으로 돌았다.
    #
    # OSIV 가 켜져 있으면 HTTP 요청이 끝날 때까지 영속성 컨텍스트가 열려 있어, 트랜잭션
    # 밖에서 지연 연관을 건드려도 동작한다. 편해 보이지만 그 의존이 코드에 드러나지 않은
    # 채 쌓이고, 요청 내내 커넥션을 붙들어 부하가 높을 때 풀을 고갈시킨다.
    #
    # 끄면 트랜잭션 경계가 곧 지연 로딩의 경계가 된다. 경계 밖에서 프록시를 건드리면
    # LazyInitializationException 으로 그 자리에서 드러난다 — 조용히 동작하다 부하가
    # 걸릴 때 터지는 것보다 낫다.
    open-in-view: false

---

server:
  port: 8080

spring:
  config:
    activate:
      on-profile: local

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    # open-in-view 는 위 공통 문서에 있다 (UG-335).
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# Api Key
api-key:
  prefix: gate_
  length: 31
  expiry-days: 365

# Redis channel
redis:
  demo:
    channel: demo:result

# Gateway
gateway:
  url: https://gate.univs.ai:18090

# Gate demo
gate:
  demo:
    url: https://gate.univs.ai/demo
  dashboard:
    qr-url: https://gate.univs.ai/demo

# Docs
springdoc:
  api-docs:
    path: /api-docs/gate
  swagger-ui:
    path: /swagger-ui.html

# Security logging
logging:
  level:
    org.springframework.security: DEBUG

# File
file:
  enable:
    upload: true
  api-endpoint:
    get: /api/v1/file
  root-path: ${file_save-path:C:/univs/image/sample}
  secret-key: ${file_secret-key:L2Hh9zu6T8xii7gAF48UtzRPOqKU3BOh}
  algorithm:
    way: ${file_algorithm_way:AES}
    mod: ${file_algorithm_mod:AES/ECB/PKCS5Padding}