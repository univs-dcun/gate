# chore: 자동배포 파이프라인 테스트

spring:
  application:
    name: face-service
  config:
    import: optional:configserver:http://config-server:8888
  jpa:
    # UG-358: 요청 처리 동안 EntityManager(와 커넥션)를 붙들지 않는다. 유스케이스가 이력만 짧게 나눠 커밋하므로,
    # 트랜잭션 사이(fxp·match 호출 중)에 커넥션이 남아 있으면 분리한 의미가 없다. gate 는 UG-335 에서 껐다.
    # 끄면 트랜잭션 밖 지연 로딩은 LazyInitializationException 으로 그 자리에서 드러난다.
    open-in-view: false

---

server.port: 8080

spring:
  config:
    activate:
      on-profile: local
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 10
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          default:
            readTimeout: 10000
            connectTimeout: 10000
            loggerLevel: basic

face:
  match:
    threshold: 0.85

springdoc:
  api-docs:
    path: /api-docs/face
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace