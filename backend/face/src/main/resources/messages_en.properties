# Swagger
UNAUTHORIZED=A request was attempted without authentication.
NEED_SERVICE_ROLE=Authorization is required to use this service.
NOT_FOUND=Your information requested to server is wrong. Please double-check the request information.
METHOD_NOT_ALLOWED=This is not a supported request. Please double-check the request information.
INTERNAL_SERVER_ERROR=There has been an error with the Universe platform.
TEMPORARILY_UNAVAILABLE=The service is temporarily unable to handle the request. Please try again shortly.

# Validation Messages
INVALID_INPUT=The user's request contains invalid values.
REQUIRED_BRANCH_NAME=Descriptor branch name is required.
INVALID_BRANCH_NAME_LENGTH=Descriptor branch name must be between 1 and 255 characters.
REQUIRED_FACE_ID=Face ID is required.
INVALID_FACE_ID_LENGTH=Face ID must be between 1 and 255 characters.
INVALID_FACE_ID_FORMAT=Face ID must be a UUID (36 characters).
INVALID_FILE=Invalid file. Please check the file or file format.

# ProcessType Messages
NOT_FACE_IMAGE=Please try again with a different image that contains the user's face.
NOT_MATCH=The user is not registered. Please try again.
MISMATCH=Please submit the request using the same individual's facial info(image or descriptor).
NO_DOUBLE_SIMILARITY=Please try again with a different image.
TOO_MANY_FACES=There is more than one face on the image.
FACE_NOT_FOUND=No faces are found on the image.

# UG-346: fallback when the liveness engine returns an unknown failure string
LIVENESS_FAILED=Liveness verification has failed.

# UG-346: liveness reasons copied from the gate bundle - the -777 path used to fall back for every reason
SMALL_FACE_SIZE=The face box is too small.
SMALL_RELATIVE_FACE_SIZE=The face relative size is too small.
SMALL_PUPILLARY_DISTANCE=The distance between pupils on the face is too small.
LARGE_FACE_ROTATION_ANGLE=The rotation angle of the head is too big.
FACE_TOO_CLOSE=The face is too close to the camera.
FACE_CLOSE_TO_BORDER=The face is too close to one or more image borders.
FACE_CROPPED=The face is cropped.
FACE_OCCLUDED=The face is occluded, for example with a medical mask.
EYES_CLOSED=The eyes are closed.
DARK_IMAGE=The image is too dark.
FAKE=Not verified with a real face image. Please try again.
FACE_IS_OCCLUDED=The face is occluded.
FACE_TOO_SMALL=Face size is too small.
FACE_ANGLE_TOO_LARGE=Face angle is too large.
LIVENESS_NOT_PASSED=Liveness verification has failed.
