server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 빌드 산출물 — Vite 가 파일명에 내용 해시를 넣는다(/assets/index-XXXX.js). 내용이 바뀌면 이름도 바뀌므로 1년 immutable.
    # ^~ 로 아래 정규식 location 보다 먼저 잡는다.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # public/ 에서 이름 그대로 복사되는 파일(icons·fonts·vite.svg 등) — 해시가 없어 같은 이름으로 바뀔 수 있다.
    # immutable 을 주면 바꾼 파일이 브라우저·Cloudflare 에서 최대 1년 예전 것으로 나온다 (UG-344: 보기 아이콘 교체가 dev 에
    # 보이지 않았다). no-cache 는 저장은 하되 매번 ETag/Last-Modified 로 확인하고, 안 바뀌었으면 304 로 끝난다.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|eot)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # config.js 는 항상 최신 버전 사용
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # SPA 라우팅 — 모든 경로를 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
